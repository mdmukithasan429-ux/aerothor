    <meta charset="UTF-8" />

    <script>
      // Suppress Vite HMR WebSocket connection warnings in preview sandbox
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('WebSocket') || e.filename?.includes('@vite/client'))) {
          e.stopImmediatePropagation();
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && (String(e.reason).includes('WebSocket') || String(e.reason?.stack).includes('@vite/client'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
    </script>
